# This file can also be used as a project's .asbx.yaml, at its git root.

# agent is the agent `asbx` runs when it isn't given one, `claude` or
# `codex`. `asbx claude` and `asbx codex` run that agent regardless.
agent: claude

# forgejo_enabled when set to true enables passing through forgejo
# authentication via `FORGEJO_TOKEN`. It also mirrors in the host
# configuration found at `~/Library/Application Support/fj/config.json`.
# On by default, and skipped when `fj` isn't logged in.
forgejo_enabled: true

# github_enabled when set to true enables passing through GitHub
# authentication from `gh auth token` via `GH_TOKEN`. On by default, and
# skipped when `gh` isn't logged in.
github_enabled: true

# op_allowed_secret_refs are the 1Password `op://` refs that `op read`
# and `op run` inside the container may read through the host's `op`,
# which must be installed. `op item list` only lists the items with a
# field allowed here. `*` matches anything within one path segment,
# `**` any number of them. For example:
#
# op_allowed_secret_refs:
#   - op://Dev/github/token
#   - op://Dev/aws/*
#   - op://Agent/**
op_allowed_secret_refs: []

# extra_secret_env_vars maps environment variable names to 1Password
# `op://` refs. Each secret is passed into the container as its
# environment variable, where the agent can read it. For example:
#
# extra_secret_env_vars:
#   NPM_TOKEN: op://Private/npm/credential
extra_secret_env_vars: {}

# clipboard is how clipboard tools inside the container (`wl-copy`,
# `wl-paste`, `xclip`, `xsel`, `pbcopy` and `pbpaste`) reach the host's
# clipboard, through the host's own clipboard tool:
#
# - `off`: not forwarded, the tools fail.
# - `copy`: the container can write to your clipboard, but not read it.
# - `copy_paste`: the container can also read your clipboard, such as to
#   paste an image into the agent. Anything on it, passwords included,
#   is readable by the agent.
clipboard: copy

# open_urls_enabled when set to true lets `xdg-open` inside the container
# open http and https URLs in your host's browser, such as for the agent
# to log in or show you a link. On by default, and skipped when the host
# has no `open` or `xdg-open`.
open_urls_enabled: true

# network_host when set to true runs the container on the host's
# network, so it can reach every service listening on localhost. When
# unset, host services are only reachable via `host.docker.internal`.
network_host: false

# podman_enabled when set to true lets the agent run containers with
# rootless Podman inside the container, through `podman` or `docker`.
# See "Podman" in the README for what this allows.
podman_enabled: false

# extra_mounts are paths to forward in (ro) to the container.
extra_mounts: []

claude:
  # oauth_token_secret_ref is the 1Password `op://` URL ref to retrieve
  # your claude code oauth token secret from. If empty, it is not
  # passed. When it's this default and the item doesn't exist, asbx
  # offers to create it.
  oauth_token_secret_ref: op://Private/claude-token/credential

  # litellm_token_secret_ref when set sets "LITELLM_API_KEY" for usage in
  # managed settings for passing through Anthropic API calls -> LiteLLM.
  litellm_token_secret_ref: ""

  # mirror_managed_settings when set to true enables mirroring your
  # managed-settings.json into the container. You may want to set
  # extra_mounts with this enabled.
  mirror_managed_settings: true

  # mirror_projects mirrors the host's project sessions+memory if
  # enabled. This is mounted RW. Only applies when home is `host`.
  mirror_projects: true

  # home is where Claude Code's state in the container is kept:
  #
  # - `host`: your `~/.claude` configuration is copied in, and nothing
  #   else outlives the container (except mirror_projects).
  # - `project`: kept in a Docker volume for this directory, like mise's
  #   tools. Starts empty, your `~/.claude` isn't used.
  # - `asbx`: kept in `~/.local/share/asbx/claude`, shared by every
  #   project that uses `asbx`. Starts empty, your `~/.claude` isn't
  #   used.
  home: host

codex:
  # api_key_secret_ref is the 1Password `op://` URL ref to retrieve your
  # OpenAI API key from. It's passed as `OPENAI_API_KEY`, and Codex is
  # logged in with it. If empty, Codex isn't logged in and you'll have to
  # log in on every run. When it's this default and the item doesn't
  # exist, asbx offers to create it.
  api_key_secret_ref: op://Private/codex-token/credential
