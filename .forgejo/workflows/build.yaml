name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: git.rgst.io/jaredallard/asbx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7

      # Bare owner/repo refs resolve against data.forgejo.org, which
      # doesn't reliably mirror the docker/* actions.
      - uses: https://github.com/docker/setup-qemu-action@v4
      - uses: https://github.com/docker/setup-buildx-action@v4

      - uses: https://github.com/docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: git.rgst.io
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_PACKAGES_WRITE }}

      - id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Releases hold bin/asbx pinned to the image built for its tag, which is
  # what mise's forgejo backend installs. It runs after build so a release
  # never points at an image that hasn't been pushed yet.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7

      - name: Pin image to tag
        run: |
          set -euo pipefail

          mkdir dist
          sed "s|^DOCKER_IMAGE=\"$IMAGE:latest\"\$|DOCKER_IMAGE=\"$IMAGE:$GITHUB_REF_NAME\"|" bin/asbx >dist/asbx
          if ! grep -qx "DOCKER_IMAGE=\"$IMAGE:$GITHUB_REF_NAME\"" dist/asbx; then
            echo "Error: unable to pin DOCKER_IMAGE in bin/asbx to $GITHUB_REF_NAME" >&2
            exit 1
          fi

          chmod 0755 dist/asbx
          (cd dist && sha256sum asbx >checksums.txt)

      - uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: dist
