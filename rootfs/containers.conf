# Rootless Podman inside the asbx container, which has no CAP_SYS_ADMIN
# and keeps Docker's /proc masks.

[containers]
# The masks keep the kernel from mounting a new /proc for a container in
# its own PID namespace, so containers share the sandbox's instead.
pidns = "host"

# /proc/sys is read-only, so sysctls can't be set.
default_sysctls = []

# keyctl is blocked by the sandbox's seccomp profile.
keyring = false

[engine]
# There's no systemd or journald in the sandbox.
cgroup_manager = "cgroupfs"
events_logger = "file"
